[project]
name = "yt-radio"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.2",
    "gunicorn>=25.1.0",
    "python-dotenv>=1.2.1",
    "yt-dlp>=2026.2.4",
    # JS challenge solver for yt-dlp; without it the venv's yt-dlp cannot
    # solve YouTube signature challenges (the PATH binary bundled it, which
    # masked the gap until yt-dlp was venv-pinned).
    "yt-dlp-ejs>=0.8.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
]

[tool.pytest.ini_options]
# Integration (and later smoke) tests hit the real network; they are
# deselected by default so a plain `pytest` run is hermetic unit-only.
addopts = "-m 'not integration' --timeout=120 --timeout-method=thread"
markers = [
    "unit: fast, hermetic tests (no network) — the default run",
    "integration: direct-mode tests against real YouTube from the home IP (deselected by default)",
]
